[package]
name = "hoichoi-desk"
version = "1.0.0"
description = "হইচই — Tauri desktop admin with Stronghold keychain"
edition = "2021"

[lib]
name = "hoichoi_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# none

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
