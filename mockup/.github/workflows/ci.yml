name: CI — typecheck & build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 is deprecated on GitHub runners; .nvmrc pins 22 (Next 16 needs 20.9+).
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # `npm ci` requires a committed lock file. Fall back to `npm install` and
      # warn, so a missing lock file is a clear message instead of a hard stop.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not committed — falling back to npm install. Commit the lock file for reproducible builds."
            npm install
          fi

      - name: Pure JS syntax check
        run: |
          node --check public/moderation-panel.js

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm exec tsc -- --noEmit --pretty false

      # Build must never require a live database or real secrets.
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://demo:demo@127.0.0.1:5432/demo
          TURSO_DATABASE_URL: libsql://demo.turso.io
          TURSO_AUTH_TOKEN: demo
          NEXT_TELEMETRY_DISABLED: "1"
