name: CI — typecheck & build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pure JS syntax check
        run: node --check public/option-a.js

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm exec tsc -- --noEmit --pretty false

      - name: Production build
        run: npm run build
        env:
          # Build never connects to the DB — these keep the module from
          # complaining; runtime values come from Vercel env vars.
          DATABASE_URL: postgresql://demo:demo@127.0.0.1:5432/demo
          TURSO_DATABASE_URL: libsql://demo.turso.io
          TURSO_AUTH_TOKEN: demo
          NEXT_TELEMETRY_DISABLED: "1"
