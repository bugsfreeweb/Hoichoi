name: Secret scan

# A committed API key is a live incident, not a code smell. gitleaks runs on
# every push and PR; the full history is scanned weekly so a key that leaked
# before this workflow existed is still found.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
