name: Deploy Web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Only one web deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.vercel.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck web + shared packages
        run: pnpm --filter @hoichoi/web --filter @hoichoi/db --filter @hoichoi/shared-types --filter @hoichoi/llm typecheck

      - name: Deploy production build to Vercel
        id: vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'