name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    # Named for what it runs. It used to lead with "Lint", but no package in the
    # workspace defines a lint task, so `pnpm lint` reported success while
    # checking nothing. The name claimed a gate that did not exist.
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate CI database
        run: pnpm db:migrate
        env:
          TURSO_DATABASE_URL: file:${{ github.workspace }}/data/ci-hoichoi.db
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          TURSO_DATABASE_URL: file:${{ github.workspace }}/data/ci-hoichoi.db
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          ADMIN_AUTH_SECRET: ci-only-not-a-real-secret

  desktop:
    name: Desktop (Tauri) — cargo check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Tauri system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri