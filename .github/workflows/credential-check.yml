name: Credential expiry check

# Warns seven days before a provider key / token expires, so the pipeline never
# dies silently on an expired credential.
#
# Needs two repository secrets:
#   SITE_URL     — e.g. https://hoichoifeed.vercel.app
#   CRON_SECRET  — same value as the app's CRON_SECRET env var
# Without them the job skips (it does not fail), so forks are not broken.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:

concurrency:
  group: credential-check
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expiry check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET not configured — skipping credential check."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$SITE_URL/api/cron/credentials" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat response.json
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Credential check failed."
            exit 1
          fi
