name: Pipeline cron

on:
  schedule:
    # Every 2 hours, offset to avoid the top-of-hour rush.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  FB_SESSION_COOKIE: ${{ secrets.FB_SESSION_COOKIE }}
  MAX_SOURCES_PER_RUN: ${{ vars.MAX_SOURCES_PER_RUN }}
  MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
  ARCHIVE_VISIBLE_DAYS: ${{ vars.ARCHIVE_VISIBLE_DAYS }}
  ARCHIVE_RETENTION_DAYS: ${{ vars.ARCHIVE_RETENTION_DAYS }}
  SCRAPE_REQUEST_DELAY_MS: ${{ vars.SCRAPE_REQUEST_DELAY_MS }}
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

jobs:
  scrape:
    name: Extract → rewrite → moderate → publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preflight — required secrets
        # Without this the run used to die much later at a confusing place
        # (Playwright install, or deep inside the scrape). Fail fast with the
        # exact list of what Settings → Secrets → Actions is missing.
        run: |
          missing=()
          [ -z "$TURSO_DATABASE_URL" ] && missing+=("TURSO_DATABASE_URL")
          [ -z "$TURSO_AUTH_TOKEN" ] && missing+=("TURSO_AUTH_TOKEN")
          [ -z "$FB_SESSION_COOKIE" ] && missing+=("FB_SESSION_COOKIE")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Add them under GitHub → ${GITHUB_REPOSITORY} → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set — the scrape will succeed but the web app will not be redeployed, so new posts may not appear until the next Vercel build."
          fi
      - name: Install Playwright chromium (collector browser)
        # Playwright is an optionalDependency of @hoichoi/scraper, not of the
        # workspace root, so a root-level `pnpm exec playwright` aborts with
        # "Command playwright not found" and the scrape never runs. Scope the
        # install to the package that actually depends on it.
        run: pnpm --filter @hoichoi/scraper exec playwright install --with-deps chromium
      - name: Verify browser is available
        run: pnpm --filter @hoichoi/scraper exec playwright --version
      - name: Run scraping pipeline
        run: pnpm run scrape
      - name: Ping deploy hook (if configured)
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" || true
