name: Pipeline cron

on:
  schedule:
    # Every 2 hours, offset to avoid the top-of-hour rush.
    # Every 8 hours (00:17, 08:17, 16:17 UTC), off the top of the hour to avoid
    # the scheduler's peak. Eight-hourly keeps the account well inside GitHub
    # Actions' free minutes for a private repo.
    - cron: "17 */8 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

# One scrape at a time. Without this, a manual dispatch landing while the cron
# run is still working starts a second scraper against the same raw_posts table:
# both see the same rows as unprocessed, both insert, and the "dedup" that is
# supposed to prevent duplicate posts runs twice at once. The media-mirroring
# commit at the end would also race on the same paths.
#
# cancel-in-progress is false deliberately: a queued run waits rather than
# killing a scrape that may already have committed media and posts.
concurrency:
  group: pipeline-cron
  cancel-in-progress: false

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  FB_SESSION_COOKIE: ${{ secrets.FB_SESSION_COOKIE }}
  MAX_SOURCES_PER_RUN: ${{ vars.MAX_SOURCES_PER_RUN }}
  MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
  ARCHIVE_VISIBLE_DAYS: ${{ vars.ARCHIVE_VISIBLE_DAYS }}
  ARCHIVE_RETENTION_DAYS: ${{ vars.ARCHIVE_RETENTION_DAYS }}
  SCRAPE_REQUEST_DELAY_MS: ${{ vars.SCRAPE_REQUEST_DELAY_MS }}
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
  # Transient Turso/libSQL failures (SQLITE_IOERR, brief network blips) are
  # retried inside the DB layer before a statement is allowed to fail the run.
  HOICHOI_DB_RETRIES: "5"
  HOICHOI_DB_RETRY_MS: "1500"

jobs:
  scrape:
    name: Extract → rewrite → moderate → publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preflight — required secrets
        # Without this the run used to die much later at a confusing place
        # (Playwright install, or deep inside the scrape). Fail fast with the
        # exact list of what Settings → Secrets → Actions is missing.
        run: |
          missing=()
          [ -z "$TURSO_DATABASE_URL" ] && missing+=("TURSO_DATABASE_URL")
          [ -z "$TURSO_AUTH_TOKEN" ] && missing+=("TURSO_AUTH_TOKEN")
          # Any one concrete LLM credential is enough (the scraper picks the
          # highest-priority enabled provider row). Checked here because the
          # rewrite step would otherwise fail much later and less clearly.
          llm=()
          for v in GOOGLE_API_KEY GROQ_API_KEY OPENROUTER_API_KEY \
                   ANTHROPIC_API_KEY OPENAI_API_KEY MISTRAL_API_KEY OLLAMA_BASE_URL; do
            [ -n "${!v}" ] && llm+=("$v")
          done
          if [ ${#llm[@]} -eq 0 ]; then
            missing+=("an LLM key: one of GOOGLE_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, MISTRAL_API_KEY, OLLAMA_BASE_URL")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Add them under GitHub → ${GITHUB_REPOSITORY} → Settings → Secrets and variables → Actions."
            echo "Step-by-step Bangla guide: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/SECRETS.md"
            exit 1
          fi
          # FB_SESSION_COOKIE is deliberately NOT required. Logged-in Facebook is
          # one collector among several, and a missing/expired cookie used to
          # hard-fail the whole run and take the public site's content with it.
          # The pipeline now degrades: the collector skips Facebook and the rest
          # of the run still publishes.
          if [ -z "$FB_SESSION_COOKIE" ]; then
            echo "::warning::FB_SESSION_COOKIE is not set — skipping the Facebook collector. Everything else (public sources, groups with public URLs, rewrite, publish) still runs. See docs/SECRETS.md to restore it."
          fi
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set — the scrape will succeed but the web app will not be redeployed, so new posts may not appear until the next Vercel build."
          fi
      - name: Install Playwright chromium (collector browser)
        # Playwright is an optionalDependency of @hoichoi/scraper, not of the
        # workspace root, so a root-level `pnpm exec playwright` aborts with
        # "Command playwright not found" and the scrape never runs. Scope the
        # install to the package that actually depends on it.
        run: pnpm --filter @hoichoi/scraper exec playwright install --with-deps chromium
      - name: Verify browser is available
        run: pnpm --filter @hoichoi/scraper exec playwright --version
      - name: Run scraping pipeline
        # The pipeline is idempotent (canonical-URL → pHash → embedding dedup),
        # so a whole-run retry is a safe last resort when a transient database
        # error survives the in-process retries — a Turso "disk I/O error" that
        # outlasts the backoff window used to fail the entire 8-hourly run.
        run: |
          for attempt in 1 2 3; do
            echo "── scrape attempt ${attempt}/3 ──"
            set +e
            pnpm run scrape
            code=$?
            set -e
            if [ "${code}" -eq 0 ]; then
              echo "scrape succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "scrape attempt ${attempt} failed (exit ${code})"
            if [ "${attempt}" -lt 3 ]; then
              sleep_sec=$((attempt * 90))
              echo "retrying in ${sleep_sec}s…"
              sleep "${sleep_sec}"
            fi
          done
          echo "::error::scrape failed after 3 attempts — see the log above for the cause"
          exit 1
      - name: Commit mirrored media
        # The deployed site is serverless: it can only serve bytes that exist in
        # git, because Vercel builds from the repository. When no remote storage
        # adapter is configured the scraper mirrors new images into
        # apps/web/public/uploads/ on the runner's disk, which is destroyed when
        # the job ends. Without this commit every scraped image was silently
        # lost and the post rendered with no picture.
        run: |
          git config user.name "hoichoi-bot"
          git config user.email "hoichoi-bot@users.noreply.github.com"
          git add -A apps/web/public/uploads
          if git diff --cached --quiet; then
            echo "No new media to commit."
          else
            count=$(git diff --cached --name-only | wc -l)
            git commit -m "chore(media): mirror ${count} scraped image(s) for the deployed site"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Ping deploy hook (if configured)
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" || true
